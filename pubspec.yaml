name: ui_kit
description: "A new Flutter project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  icon_font_generator: ^4.1.0

icon_font:
  input_svg_dir: assets/icons/
  output_font_file: assets/fonts/CustomIconFont.otf

  output_class_file: lib/src/presentation/typography/custom_icons.dart
  class_name: CustomIcons
  package: ui_kit
  format: true

  font_name: CustomIconFont
  verbose: false

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  fonts:
    - family: CustomIconFont
      fonts:
        - asset: assets/fonts/CustomIconFont.otf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
  assets:
    - assets/icons/